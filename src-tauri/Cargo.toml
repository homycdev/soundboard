[package]
name = "soundboard-native"
version = "0.1.0"
description = "Native core for the Soundboard desktop application"
authors = ["Abdulkhamid M"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "soundboard_native"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "soundboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
env_logger = "0.11"
kira = { version = "=0.12.3", default-features = false, features = ["cpal", "mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-global-shortcut = "=2.3.2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
